<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manya Agarwal &mdash; Financial Analyst</title>
  <meta name="description" content="Manya Agarwal &mdash; Financial Analyst with expertise in data-driven financial reporting, Excel modeling, Power BI dashboards, and analytical frameworks across finance domains." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0f1c2e;
      --navy-mid: #162236;
      --navy-light: #1e3250;
      --gold: #c9a84c;
      --gold-light: #e0c278;
      --gold-pale: #f5edd6;
      --slate: #4a5568;
      --slate-light: #718096;
      --cream: #faf8f4;
      --white: #ffffff;
      --border: rgba(201,168,76,0.18);
      --shadow: 0 4px 32px rgba(15,28,46,0.10);
      --shadow-sm: 0 2px 12px rgba(15,28,46,0.07);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--cream);
      color: var(--navy);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    /* -- NAV -- */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(15,28,46,0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      max-width: 1100px; margin: 0 auto;
      padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between;
      height: 64px;
    }
    .nav-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem; font-weight: 600;
      color: var(--gold);
      letter-spacing: 0.02em;
      text-decoration: none;
    }
    .nav-links {
      display: flex; gap: 32px; list-style: none;
    }
    .nav-links a {
      color: rgba(255,255,255,0.75);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--gold); }

    @media (max-width: 600px) {
      .nav-links { gap: 18px; }
      .nav-links a { font-size: 0.75rem; }
    }

    /* -- HERO -- */
    #hero {
      min-height: 100vh;
      background: linear-gradient(145deg, var(--navy) 0%, var(--navy-mid) 55%, #1a2d4a 100%);
      display: flex; align-items: center;
      padding: 100px 24px 80px;
      position: relative;
      overflow: hidden;
    }
    #hero::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 700px 500px at 80% 40%, rgba(201,168,76,0.06) 0%, transparent 70%),
        radial-gradient(ellipse 400px 400px at 10% 80%, rgba(201,168,76,0.04) 0%, transparent 60%);
      pointer-events: none;
    }
    /* subtle grid overlay */
    #hero::after {
      content: '';
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(201,168,76,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(201,168,76,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }
    .hero-inner {
      max-width: 1100px; margin: 0 auto; width: 100%;
      position: relative; z-index: 1;
    }
    .hero-label {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
      background: rgba(201,168,76,0.1);
      border: 1px solid rgba(201,168,76,0.25);
      padding: 6px 16px;
      border-radius: 100px;
      margin-bottom: 32px;
    }
    .hero-name {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.6rem, 6vw, 4.4rem);
      font-weight: 600;
      color: var(--white);
      line-height: 1.1;
      margin-bottom: 16px;
      letter-spacing: -0.01em;
    }
    .hero-name span { color: var(--gold); }
    .hero-title {
      font-size: clamp(1rem, 2.2vw, 1.22rem);
      color: rgba(255,255,255,0.65);
      font-weight: 300;
      margin-bottom: 36px;
      max-width: 560px;
      line-height: 1.7;
    }
    .hero-pills {
      display: flex; flex-wrap: wrap; gap: 10px;
      margin-bottom: 48px;
    }
    .pill {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: rgba(255,255,255,0.7);
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 7px 16px;
      border-radius: 100px;
      transition: all 0.2s;
    }
    .pill:hover {
      background: rgba(201,168,76,0.12);
      border-color: rgba(201,168,76,0.3);
      color: var(--gold-light);
    }
    .hero-cta {
      display: flex; gap: 16px; flex-wrap: wrap;
    }
    .btn-primary {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--gold);
      color: var(--navy);
      font-weight: 600;
      font-size: 0.88rem;
      letter-spacing: 0.04em;
      padding: 14px 28px;
      border-radius: 6px;
      text-decoration: none;
      transition: all 0.2s;
      border: none;
    }
    .btn-primary:hover {
      background: var(--gold-light);
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(201,168,76,0.3);
    }
    .btn-outline {
      display: inline-flex; align-items: center; gap: 8px;
      background: transparent;
      color: rgba(255,255,255,0.8);
      font-weight: 500;
      font-size: 0.88rem;
      letter-spacing: 0.04em;
      padding: 13px 28px;
      border-radius: 6px;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.2);
      transition: all 0.2s;
    }
    .btn-outline:hover {
      border-color: var(--gold);
      color: var(--gold);
      transform: translateY(-1px);
    }

    /* -- DIVIDER -- */
    .section-divider {
      width: 48px; height: 3px;
      background: var(--gold);
      margin: 0 auto 20px;
      border-radius: 2px;
    }

    /* -- SECTION COMMON -- */
    section {
      padding: 96px 24px;
    }
    .section-inner {
      max-width: 1100px; margin: 0 auto;
    }
    .section-tag {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 14px;
      text-align: center;
    }
    .section-heading {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.7rem, 3.5vw, 2.5rem);
      font-weight: 600;
      text-align: center;
      margin-bottom: 60px;
      color: var(--navy);
      line-height: 1.2;
    }
    .section-heading.light { color: var(--white); }

    /* -- ABOUT -- */
    #about {
      background: var(--white);
    }
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      align-items: start;
    }
    @media (max-width: 768px) {
      .about-grid { grid-template-columns: 1fr; gap: 40px; }
    }
    .about-text p {
      color: var(--slate);
      font-size: 0.97rem;
      margin-bottom: 18px;
      line-height: 1.8;
    }
    .about-text p:last-child { margin-bottom: 0; }
    .about-text strong { color: var(--navy); font-weight: 600; }
    .about-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .stat-card {
      background: var(--cream);
      border: 1px solid rgba(201,168,76,0.15);
      border-radius: 8px;
      padding: 24px;
    }
    .stat-card .stat-value {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 600;
      color: var(--gold);
      display: block;
      margin-bottom: 4px;
    }
    .stat-card .stat-label {
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--slate-light);
      text-transform: uppercase;
    }
    .confidentiality-note {
      margin-top: 28px;
      padding: 16px 20px;
      background: rgba(201,168,76,0.06);
      border-left: 3px solid var(--gold);
      border-radius: 0 6px 6px 0;
      font-size: 0.82rem;
      color: var(--slate);
      line-height: 1.65;
    }

    /* -- PROJECTS -- */
    #projects {
      background: var(--cream);
    }
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 28px;
    }
    .project-card {
      background: var(--white);
      border: 1px solid rgba(15,28,46,0.07);
      border-radius: 10px;
      overflow: hidden;
      transition: transform 0.25s, box-shadow 0.25s;
      position: relative;
    }
    .project-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 48px rgba(15,28,46,0.12);
    }
    .project-card.coming-soon {
      opacity: 0.65;
      pointer-events: none;
    }
    .project-preview {
      height: 180px;
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
      display: flex; align-items: center; justify-content: center;
      position: relative;
      overflow: hidden;
    }
    /* Mini chart preview for project card */
    .project-preview svg {
      opacity: 0.9;
    }
    .project-badge {
      position: absolute; top: 14px; right: 14px;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 100px;
      color: var(--navy);
      background: var(--gold);
    }
    .project-badge.soon {
      background: rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.6);
    }
    .project-body {
      padding: 28px;
    }
    .project-category {
      font-size: 0.68rem;
      font-weight: 600;
