<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manya Agarwal &mdash; Financial Analyst</title>
  <meta name="description" content="Manya Agarwal &mdash; Financial Analyst with expertise in data-driven financial reporting, Excel modeling, Power BI dashboards, and analytical frameworks across finance domains." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0f1c2e;
      --navy-mid: #162236;
      --navy-light: #1e3250;
      --gold: #c9a84c;
      --gold-light: #e0c278;
      --gold-pale: #f5edd6;
      --slate: #4a5568;
      --slate-light: #718096;
      --cream: #faf8f4;
      --white: #ffffff;
      --border: rgba(201,168,76,0.18);
      --shadow: 0 4px 32px rgba(15,28,46,0.10);
      --shadow-sm: 0 2px 12px rgba(15,28,46,0.07);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--cream);
      color: var(--navy);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    /* ââ NAV ââ */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      background: rgba(15,28,46,0.96) ; backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
    }
    .nav-inner {
      display: flex; align-items: center; justify-content: space-between;
      max-width: 1080px; margin: 0 auto; height: 64px;
    }
    .nav-logo { font-family: 'Playfair Display', serif; font-size: 1.15rem; font-weight: 600; color: var(--white); text-decoration: none; }
    .nav-links { display: flex; gap: 28px; list-style: none; }
    .nav-links a { color: rgba(255,255,255,0.7); text-decoration: none; font-size: 0.86rem; letter-spacing: 0.07em; text-transform: uppercase; transition: color 0.2s; }
    .nav-links a:hover { color: var(--gold); }

<script>
  // Scroll-triggered fade-up
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12 });

  document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
</script>
